<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="jidlo.css" />
</head>
<body>
  <div class="app">
    <aside class="side">

            <path d="M4 15c3-7 5-7 7-1s4 6 7 1" stroke="#1a1712" stroke-width="1.8"/>

          </svg>
        </div>
        <div>
          <h1>NIKO MOST</h1>
          <small>větev jídlo</small>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="me-chip">
          <div class="avatar" id="avatar">K</div>
          <div>
            <div id="alias">Kapka 8</div>

    <main class="main">

      <section class="view" id="view-mosty"></section>
      <section class="view" id="view-mapa"></section>
      <section class="view" id="view-reka"></section>
      <section class="view" id="view-studanky"></section>
      <section class="view" id="view-sloz"></section>
      <section class="view" id="view-ja"></section>

  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-bg" id="modalBg" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modal"></div>
  </div>
  <script src="jidlo-a.js"></script>
  <script src="jidlo-b.js"></script>

</html>
