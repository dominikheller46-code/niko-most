<!DOCTYPE html>
<html lang="cs">
<head>

  <main>
    <h1>NIKO MOST</h1>
    <p>Nemusíš mít všechno. Stačí přidat svůj kousek. Dvě větve jedné sítě — věci a jídlo. Bez jména, telefonu a adresy.</p>
    <div class="row">
      <a href="jidlo.html"><small>VĚTEV</small><b>Jídlo</b><span>Talíř, košík, vlaštovka, Studánka. Systém hledá, co chybí k dokončení pomoci.</span></a>
      <a href="veci.html"><small>VĚTEV</small><b>Věci</b><span>Bunda, boty, kniha, most beze slov. Ne bazar. Síť kusů cesty.</span></a>
    </div>
  </main>
